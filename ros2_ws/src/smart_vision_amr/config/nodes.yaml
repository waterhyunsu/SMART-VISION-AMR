/astar_planner:
  ros__parameters:
    map_topic: /map
    map_frame: map
    base_frame: base_footprint
    occupied_threshold: 65
    obstacle_inflation_cells: 5  # 0.25 m at the map's 0.05 m resolution
    goal_snap_tolerance_m: 0.05  # Limit added endpoint error to one 5 cm map cell
    no_path_grace_sec: 0.5  # Ignore scan-to-scan gaps before canceling the active route
/path_follower:
  ros__parameters:
    action_name: /follow_path
    controller_id: FollowPath
    goal_checker_id: general_goal_checker
    controller_frame: odom
    path_change_stability_sec: 0.6
/change_memory:
  ros__parameters:
    map_topic: /map
    scan_topic: /scan
    map_frame: map
    base_frame: base_footprint
    occupied_threshold: 65
    confirm_observations: 5
    clear_observations: 5
    confirm_min_duration_sec: 2.0
    clear_min_duration_sec: 2.0
    min_observation_interval_sec: 0.25
    save_every_scans: 5
